  - name: "baseline_cascade_dream"
    path: "./algorithms/baseline_dream.py"
    step_func: "run_step"

  - name: "threshold_verifier"
    path: "./algorithms/threshold_verifier.py"
    step_func: "run_step"

  - name: "top_k_intersection"
    path: "./algorithms/top_k_intersection.py"
    step_func: "run_step"
