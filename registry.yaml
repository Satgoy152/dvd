available_models:
  - name: "llada_8b_base"
    path: "./adapters/llada_adapter.py"
    init_func: "load_llada_model"
    tokenizer_func: "llada_tokenize"
    gen_func: "llada_generate"
    model_id: "GSAI-ML/LLaDA-8B-Base"

  - name: "llada_8b_instruct"
    path: "./adapters/llada_adapter.py"
    init_func: "load_llada_model"
    tokenizer_func: "llada_tokenize"
    gen_func: "llada_generate"
    model_id: "GSAI-ML/LLaDA-8B-Instruct"
available_algorithms:
  - name: "baseline_cascade"
    path: "./algorithms/baseline.py"
    step_func: "run_step"

  - name: "threshold_verifier"
    path: "./algorithms/threshold_verifier.py"
    step_func: "run_step"

  - name: "top_k_intersection"
    path: "./algorithms/top_k_intersection.py"
    step_func: "run_step"
